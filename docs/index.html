<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Website options for Mom's Got This Cleaning Co., house cleaning around Kansas City.">
<meta name="robots" content="noindex, nofollow">
<meta property="og:type" content="website">
<meta property="og:title" content="Mom's Got This Cleaning Co. website options">
<meta property="og:image" content="https://momskc.com/sites/19-original-refined/og.jpg">
<link rel="icon" href="images/logo-640.webp">
<title>Mom's Got This Designs</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a plain gallery. The current site beside its refresh, then the new designs; each card shows the desktop view with the phone view over it, a palette strip, and links to open or phone-preview the site. */
:root {
  --bg: #efefec;
  --card: #ffffff;
  --ink: #17191c;
  --muted: #5d6168;
  --line: #d9dad5;
  --heart: #d6244f;
  --chip: #e4e5e0;
  --display: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131416; --card: #1c1e21; --ink: #ecebe7; --muted: #a3a7ad; --line: #2d3034; --heart: #ff5d7f; --chip: #26292d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131416; --card: #1c1e21; --ink: #ecebe7; --muted: #a3a7ad; --line: #2d3034; --heart: #ff5d7f; --chip: #26292d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font: 400 16px/1.55 var(--display);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 32px;
}
.wrap { max-width: 1180px; margin: 0 auto; }
a { color: inherit; }
header.intro { padding-block: 48px 28px; display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
.kicker { font: 500 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font-weight: 800; font-size: clamp(2.3rem, 7vw, 4.6rem); line-height: .98; letter-spacing: -.03em; margin: 0; text-wrap: balance; }
.lede { max-width: 62ch; margin: 0; font-size: 1.08rem; color: var(--muted); }
.lede strong { color: var(--ink); font-weight: 600; }
.how { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 0; padding: 0; list-style: none; }
.how li { background: var(--chip); border-radius: 999px; padding: 8px 14px; font-size: .92rem; }

.shelf { border-top: 1px solid var(--line); padding-block: 28px 12px; }
.shelf-head { display: grid; gap: 4px 24px; grid-template-columns: minmax(0, 1fr); margin-bottom: 18px; }
@media (min-width: 760px) { .shelf-head { grid-template-columns: 260px minmax(0, 1fr); align-items: baseline; } }
.shelf h2 { margin: 0; font-size: 1.5rem; font-weight: 700; letter-spacing: -.01em; }
.shelf-head p { margin: 0; color: var(--muted); max-width: 70ch; }
.shelf-head a { color: var(--muted); }

.grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.stage { position: relative; display: block; aspect-ratio: 16 / 11; background: var(--chip); overflow: hidden; text-decoration: none; }
.stage .desk { position: absolute; left: 0; top: 0; width: 100%; height: auto; transition: transform .35s ease; transform-origin: top left; }
.stage .phone { position: absolute; right: 14px; bottom: -40%; width: 34%; height: auto; border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,.28), 0 0 0 5px #0f1012; transition: transform .35s ease; }
.stage:hover .desk { transform: scale(1.02); }
.stage:hover .phone { transform: translateY(-14px); }
.stage:focus-visible { outline: 3px solid var(--ink); outline-offset: -3px; }
.swatches { display: flex; height: 8px; }
.swatches span { flex: 1; }
.body { padding: 14px 16px 16px; display: grid; gap: 8px; flex: 1; align-content: start; }
.row { display: flex; align-items: center; gap: 10px; }
.num { font: 500 12px/1 var(--mono); color: var(--muted); }
.card h3 { margin: 0; font-size: 1.15rem; font-weight: 700; letter-spacing: -.01em; flex: 1; min-width: 0; }
.card p { margin: 0; color: var(--muted); font-size: .95rem; }
.actions { display: flex; gap: 10px; align-items: center; margin-top: 6px; }
.open { flex: 1; text-align: center; background: var(--ink); color: var(--bg); text-decoration: none; font-weight: 600;
  border-radius: 10px; padding: 12px 14px; min-height: 44px; }
.open:hover { opacity: .88; }
.open:focus-visible, .card.before { border-style: dashed; }

footer { color: var(--muted); font-size: .9rem; padding-block: 28px; border-top: 1px solid var(--line); }
@media (prefers-reduced-motion: reduce) { .stage .desk, .stage .phone { transition: none; } }
.section { border-top: 1px solid var(--line); padding-block: 28px 12px; }
.section h2 { margin: 0 0 6px; font-size: 1.6rem; font-weight: 800; letter-spacing: -.015em; }
.section > p { margin: 0 0 18px; color: var(--muted); max-width: 62ch; }
.pair { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 760px) { .pair { grid-template-columns: 1fr 1fr; } }
.tag { font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 5px 8px; }
.tag.after { color: var(--heart); border-color: var(--heart); }
.phone-open { min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--ink); font: 600 14px var(--display); cursor: pointer; white-space: nowrap; }
.phone-open:hover { border-color: var(--ink); }
.phone-open:focus-visible { outline: 3px solid var(--heart); outline-offset: 2px; }
@media (max-width: 520px) { .phone-open { display: none; } }
.phone-dialog { border: 0; padding: 0; background: transparent; max-width: none; max-height: none; overflow: visible; }
.phone-dialog::backdrop { background: rgb(12 14 16 / 78%); }
.phone-shell { display: grid; gap: 12px; justify-items: center; }
.phone-top { display: flex; gap: 10px; align-items: center; width: 406px; max-width: calc(100vw - 32px); color: #fff; font: 600 15px var(--display); }
.phone-top span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.phone-top a, .phone-top button { color: #fff; background: transparent; border: 1px solid rgb(255 255 255 / 45%); border-radius: 8px; min-height: 40px; padding: 0 12px; font: inherit; text-decoration: none; display: inline-flex; align-items: center; cursor: pointer; }
.phone-bezel { padding: 8px; border-radius: 34px; background: #0e0f11; box-shadow: 0 20px 60px rgb(0 0 0 / 45%); }
.phone-bezel iframe { display: block; width: 390px; height: min(844px, calc(100dvh - 120px)); border: 0; border-radius: 26px; background: #fff; }

[hidden]{display:none!important}
body{margin:0}
</style>
</head>
<body>


<div class="wrap">
  <header class="intro">
    <div class="kicker">Mom's Got This Cleaning Co.</div>
    <h1>Website designs</h1>
  </header>
  <main id="shelves"></main>
  <footer>Photos are real client homes, shown with permission. One family-name sign was replaced for privacy.</footer>
</div>

<dialog class="phone-dialog" id="phone-preview" aria-labelledby="phone-title">
  <div class="phone-shell">
    <div class="phone-top"><span id="phone-title">Phone preview</span><a id="phone-full" href="#">Open full site</a><button type="button" id="phone-close">Close</button></div>
    <div class="phone-bezel"><iframe id="phone-frame" title="Phone preview"></iframe></div>
  </div>
</dialog>

<script src="page-1.js"></script>

</body>
</html>
