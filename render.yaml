# Render static-site blueprint, adapted from the ChatGPT package (momskc-preview). Publish the chosen site's folder as public/.
# Scripts must be external files (script-src 'self'); tools/build_deploy.py moves each page's inline scripts out.
# img-src adds blob: for the browser's own image decoding. noindex stays while it is a preview; remove the
# X-Robots-Tag header when the real site launches so Google can list it.
services:
  - type: web
    runtime: static
    name: momskc-preview
    buildCommand: "test -f docs/index.html"
    staticPublishPath: ./docs
    domains:
      - momskc.com
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'"
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
      - path: /*
        name: X-Robots-Tag
        value: "noindex, nofollow"
